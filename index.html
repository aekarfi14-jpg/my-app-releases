<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17161a">
  <meta name="description" content="ألعابي — كتالوج صغير لألعاب صنعتها بنفسي، جاهزة للتحميل والتجربة مباشرة.">

  <title>ألعابي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="wrap header-inner">
    <span class="wordmark">ألعابي</span>
  </div>
</header>

<main class="wrap">

  <section class="intro">
    <h1>ألعاب صغيرة، صنعتها بنفسي</h1>
    <p class="intro-text">
      هون تلقى <span id="gamesCount">…</span> جاهزة للتحميل والتجربة مباشرة،
      بدون تسجيل دخول ولا اشتراكات.
    </p>
  </section>

  <section class="list-section">
    <h2 class="list-title">الألعاب</h2>

    <div id="games" class="games" aria-live="polite">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>
  </section>

  <!-- التقييم العام للموقع والألعاب -->
  <section class="rating-section">

    <h2>جربت الألعاب؟</h2>
    <p class="rating-text">
      رأيك يساعدني أطوّرها أكثر، تقييم واحد بيكفي.
    </p>

    <div id="stars" class="stars" role="group" aria-label="تقييم من خمس نجوم">
      <button type="button" data-value="1" aria-label="نجمة واحدة">★</button>
      <button type="button" data-value="2" aria-label="نجمتان">★</button>
      <button type="button" data-value="3" aria-label="ثلاث نجوم">★</button>
      <button type="button" data-value="4" aria-label="أربع نجوم">★</button>
      <button type="button" data-value="5" aria-label="خمس نجوم">★</button>
    </div>

    <p id="rateThanks" class="rate-thanks"></p>

    <textarea
      id="rateComment"
      placeholder="أضف تعليقك (اختياري)..."
      rows="3"></textarea>

    <button id="rateSend" type="button" class="btn btn-primary send-rating">
      إرسال التقييم
    </button>

  </section>

</main>

<footer class="wrap">
  <p>ألعابي — كل الألعاب هنا مجانية بالكامل</p>
</footer>

<!-- نافذة QR -->
<div id="qrModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="qrGameName">

  <div class="modal-card">

    <button id="closeQr" type="button" class="modal-close" aria-label="إغلاق">×</button>

    <h3>رمز التحميل</h3>
    <p id="qrGameName" class="qr-game-name"></p>

    <div id="qrCode" class="qr-box"></div>

    <p class="qr-hint">امسح الرمز بكاميرا هاتفك لتحميل اللعبة</p>

  </div>

</div>

<!-- يبقى مخفياً حتى لا يغادر المستخدم الموقع عند إرسال التقييم -->
<iframe
  name="hidden_review_frame"
  id="hiddenReviewFrame"
  style="display:none;">
</iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>

</body>
</html>
