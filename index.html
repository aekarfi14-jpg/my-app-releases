<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101510">

  <title>ألعابي</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-icon">🎮</div>

    <div>
      <h1>ألعابي</h1>
      <p>ألعاب جماعية من صنعي</p>
    </div>
  </div>
</header>

<main>

  <section class="intro">
    <span>MY GAMES</span>
    <h2>اختار لعبتك</h2>
    <p>
      حمّل اللعبة وجربها مع صحابك وعائلتك.
    </p>
  </section>

  <section id="games" class="games">
    <div class="loading">جاري تحميل الألعاب...</div>
  </section>

  <!-- التقييم العام للموقع والألعاب -->
  <section class="rating-box">

    <h2>جربت الألعاب؟ رأيك يهمني ⭐</h2>

    <p>
      قيّم الألعاب وشاركنا انطباعك، رأيك يساعدني نطوّرها أكثر.
    </p>

    <div id="stars" class="stars">
      <button data-value="1">★</button>
      <button data-value="2">★</button>
      <button data-value="3">★</button>
      <button data-value="4">★</button>
      <button data-value="5">★</button>
    </div>

    <p id="rateThanks" class="rate-thanks"></p>

    <textarea
      id="rateComment"
      placeholder="أضف تعليقك (اختياري)..."
      rows="4"></textarea>

    <button id="rateSend" class="send-rating">
      إرسال التقييم
    </button>

  </section>

</main>

<footer>
  <p>ألعابي 🎮</p>
  <p>كل الألعاب مجانية</p>
</footer>

<!-- نافذة QR -->
<div id="qrModal" class="modal hidden">

  <div class="modal-card">

    <button id="closeQr" class="close">×</button>

    <h3>رمز التحميل</h3>

    <div id="qrCode"></div>

    <p>امسح الرمز لتحميل اللعبة</p>

  </div>

</div>

<!-- يبقى مخفياً حتى لا يغادر المستخدم الموقع عند إرسال التقييم -->
<iframe
  name="hidden_review_frame"
  id="hiddenReviewFrame"
  style="display:none;">
</iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>

</body>
</html>
